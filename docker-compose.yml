networks:
  socar_dispatch_net:
    driver: bridge

volumes:
  socar_dispatch_pgdata:
  socar_dispatch_redisdata:
  socar_dispatch_miniodata:

services:
  # ----------------------------------------------------------------------------
  # 1. Spatial Database (PostgreSQL + PostGIS)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: socar_dispatch_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socar_dispatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - socar_dispatch_pgdata:/var/lib/postgresql/data
      - ./docker/init-scripts/01-init-postgis.sh:/docker-entrypoint-initdb.d/01-init-postgis.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-socar_dispatch}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - socar_dispatch_net

  # ----------------------------------------------------------------------------
  # 2. Distributed Cache & State Bus (Redis)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: socar_dispatch_redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - socar_dispatch_redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - socar_dispatch_net

  # ----------------------------------------------------------------------------
  # 3. Object Storage (MinIO)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: socar_dispatch_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - socar_dispatch_miniodata:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - socar_dispatch_net

  # ----------------------------------------------------------------------------
  # 4. Storage Bucket Initialization Companion (MinIO Client)
  # ----------------------------------------------------------------------------
  createbuckets:
    image: minio/mc:latest
    container_name: socar_dispatch_minio_init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./docker/init-scripts/02-init-minio-buckets.sh:/scripts/02-init-minio-buckets.sh:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET:-socar-dispatch-media}
    entrypoint: [ "/bin/sh", "/scripts/02-init-minio-buckets.sh" ]
    restart: "no"
    networks:
      - socar_dispatch_net

  # ----------------------------------------------------------------------------
  # 5. .NET Web API Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socar_dispatch_api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080
      - DB_CONNECTION_STRING=Host=postgres;Port=5432;Database=${POSTGRES_DB:-socar_dispatch};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgrespassword}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-socar_dispatch};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgrespassword}
      - REDIS_CONNECTION_STRING=redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-miniopassword}
      - MINIO_DEFAULT_BUCKET=${MINIO_DEFAULT_BUCKET:-socar-dispatch-media}
      - MINIO_FEEDBACK_BUCKET=${MINIO_FEEDBACK_BUCKET:-socar-dispatch-feedbacks}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - JWT_SECRET_KEY=${JWT_SECRET:-SOCAR_Super_Secret_Key_For_Emergency_Dispatch_System_2026}
      - JWT_ISSUER=${JWT_ISSUER:-socar-dispatch-api}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-socar-dispatch-clients}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - socar_dispatch_net

  # ----------------------------------------------------------------------------
  # 6. Blazor WebAssembly Web Client
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./clients/web/SocarDispatch.Web
      dockerfile: Dockerfile
    container_name: socar_dispatch_web
    ports:
      - "${WEB_PORT:-5000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/healthz || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - socar_dispatch_net

  # ----------------------------------------------------------------------------
  # 7. Reverse Proxy & Ingress Gateway (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    container_name: socar_dispatch_proxy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:80/healthz || exit 1" ]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - socar_dispatch_net
