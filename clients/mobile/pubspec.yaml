name: socar_dispatch_mobile
description: "SOCAR Dispatch Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6

  # Networking & HTTP
  dio: ^5.7.0

  # Secure Local Storage
  flutter_secure_storage: ^9.2.2

  # Image Picker & Caching
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UI, Fonts & SVG
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
