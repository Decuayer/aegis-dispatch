types {
    application/wasm                                  wasm;
    application/octet-stream                          clr pdb bcl webcil dll;
    application/json                                  json;
    text/html                                         html htm;
    text/css                                          css;
    text/javascript                                   js mjs;
    image/png                                         png;
    image/jpeg                                        jpeg jpg;
    image/svg+xml                                     svg;
    image/x-icon                                      ico;
    font/woff                                         woff;
    font/woff2                                        woff2;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static assets and WASM binaries
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/octet-stream
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Blazor WASM framework binaries & compressed bundles
    location ~* \.(wasm|webcil|dll|pdb|dat)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static CSS and JS assets
    location ~* \.(css|js|woff2?|svg|png|jpg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Configuration files - never cache
    location = /appsettings.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA Entry Point - Fallback to index.html with no-cache for instant updates
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }
}
