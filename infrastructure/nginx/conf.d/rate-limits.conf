# Rate limiting zone for general API traffic: 30 requests per second
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Rate limiting zone for sensitive authentication endpoints: 5 requests per minute
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Standard HTTP response status code for exceeded rate limits
limit_req_status 429;
