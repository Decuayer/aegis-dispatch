version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: socar_dispatch_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socar_dispatch_prod}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required production database password}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-socar_dispatch_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  redis:
    image: redis:7-alpine
    container_name: socar_dispatch_redis_prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  minio:
    image: minio/minio:latest
    container_name: socar_dispatch_storage_prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Required production storage access key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Required production storage secret key}
    volumes:
      - miniodata_prod:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always

  createbuckets:
    image: minio/mc:latest
    container_name: socar_dispatch_minio_init_prod
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set prodminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing prodminio/$${MINIO_DEFAULT_BUCKET:-socar-dispatch-media};
      /usr/bin/mc anonymous set download prodminio/$${MINIO_DEFAULT_BUCKET:-socar-dispatch-media};
      /usr/bin/mc mb --ignore-existing prodminio/socar-dispatch-feedbacks;
      /usr/bin/mc anonymous set download prodminio/socar-dispatch-feedbacks;
      exit 0;
      "
    restart: "no"

volumes:
  pgdata_prod:
  redisdata_prod:
  miniodata_prod:
