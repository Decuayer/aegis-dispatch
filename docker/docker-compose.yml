
version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: socar_dispatch_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socar_dispatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: socar_dispatch_redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: socar_dispatch_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    container_name: socar_dispatch_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set localminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-miniopassword};
      /usr/bin/mc mb --ignore-existing localminio/${MINIO_DEFAULT_BUCKET:-socar-dispatch-media};
      /usr/bin/mc anonymous set download localminio/${MINIO_DEFAULT_BUCKET:-socar-dispatch-media};
      /usr/bin/mc mb --ignore-existing localminio/socar-dispatch-feedbacks;
      /usr/bin/mc anonymous set download localminio/socar-dispatch-feedbacks;
      exit 0;
      "
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata: