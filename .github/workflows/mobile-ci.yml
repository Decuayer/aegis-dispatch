name: Mobile CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'clients/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'clients/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & Test (Flutter)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients/mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Linter & Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test
