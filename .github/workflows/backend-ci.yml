name: Backend CI — Quality, Security & Automated Tests

on:
  push:
    branches: [ main, master, develop, 'release/*' ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.editorconfig'
  pull_request:
    branches: [ main, master, develop, 'release/*' ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Security & Secret Leak Audit
  # ----------------------------------------------------------------------------
  security-and-secret-audit:
    name: Secret Leak Detection & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Leaked Secrets & API Keys (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Audit NuGet Packages for Known Vulnerabilities
        run: |
          dotnet list backend/SocarDispatch.slnx package --vulnerable --include-transitive || true

  # ----------------------------------------------------------------------------
  # 2. Code Quality, Formatting & Static Analysis
  # ----------------------------------------------------------------------------
  code-quality-and-formatting:
    name: Code Formatting & Roslyn Analyzers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj', 'backend/**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Solution Dependencies
        run: dotnet restore SocarDispatch.slnx

      - name: Verify Code Formatting (.editorconfig)
        run: dotnet format SocarDispatch.slnx whitespace --verify-no-changes --verbosity normal

      - name: Build Solution & Execute Roslyn Static Analysis
        run: dotnet build SocarDispatch.slnx --configuration Release --no-restore

  # ----------------------------------------------------------------------------
  # 3. Automated Tests & Code Coverage Quality Gate
  # ----------------------------------------------------------------------------
  build-and-test:
    name: Automated Tests & Coverage Quality Gate
    needs: [security-and-secret-audit, code-quality-and-formatting]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj', 'backend/**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Solution Dependencies
        run: dotnet restore SocarDispatch.slnx

      - name: Compile Solution (Release Mode)
        run: dotnet build SocarDispatch.slnx --configuration Release --no-restore

      - name: Run Test Suites with XPlat Code Coverage
        run: |
          dotnet test SocarDispatch.slnx \
            --filter "FullyQualifiedName!~IntegrationTests" \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=backend-test-results.trx" \
            --collect:"XPlat Code Coverage;Format=cobertura,opencover" \
            --results-directory ./TestResults

      - name: Generate Code Coverage Summary & Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
        with:
          reports: 'backend/TestResults/**/coverage.cobertura.xml'
          targetdir: 'backend/TestResults/CoverageReport'
          reporttypes: 'HtmlInline;Cobertura;MarkdownSummaryGithub'
          title: 'SOCAR Dispatch — Backend Coverage Report'

      - name: Publish Test Summary to GitHub PR / Run Summary
        run: |
          if [ -f backend/TestResults/CoverageReport/SummaryGithub.md ]; then
            cat backend/TestResults/CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Results & Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-and-coverage-reports
          path: |
            backend/TestResults/**/*.trx
            backend/TestResults/**/coverage.cobertura.xml
            backend/TestResults/CoverageReport/
          retention-days: 14

  # ----------------------------------------------------------------------------
  # 4. GitHub Native CodeQL SAST Analysis
  # ----------------------------------------------------------------------------
  codeql-analysis:
    name: GitHub CodeQL SAST Analysis (C#)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Solution for CodeQL Analysis
        run: dotnet build backend/SocarDispatch.slnx --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:csharp"
          upload: ${{ github.event.repository.private == false && 'always' || 'never' }}
          output: 'codeql-results'

      - name: Stage SARIF Report for Artifact Upload
        if: always()
        run: |
          mkdir -p codeql-results
          if [ -d "../results" ]; then
            cp -rf ../results/* codeql-results/ 2>/dev/null || true
          fi

      - name: Upload CodeQL SARIF Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-csharp-sast-sarif
          path: codeql-results/
          if-no-files-found: ignore
          retention-days: 14
