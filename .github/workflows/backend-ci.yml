name: Backend CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Format & Test (.NET 8)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj', 'backend/**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore SocarDispatch.slnx

      - name: Verify Code Formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build Solution (Release)
        run: dotnet build SocarDispatch.slnx --configuration Release --no-restore

      - name: Run Automated Test Suite
        run: dotnet test SocarDispatch.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=backend-test-results.trx"
