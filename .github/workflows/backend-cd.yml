name: Backend & Web CD — Container Build, Security Scan & Registry Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Dockerfile Linting & Best Practices Audit
  # ----------------------------------------------------------------------------
  dockerfile-lint:
    name: Lint Dockerfiles (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lint Backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

      - name: Lint Web Client Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: clients/web/SocarDispatch.Web/Dockerfile
          failure-threshold: error

  # ----------------------------------------------------------------------------
  # Stage 2: Database Migration Bundle Guard
  # ----------------------------------------------------------------------------
  database-migration-guard:
    name: Prepare Database Migration Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef CLI Tool
        run: dotnet tool install --global dotnet-ef || dotnet tool update --global dotnet-ef

      - name: Restore Solution Dependencies
        run: dotnet restore SocarDispatch.slnx

      - name: Generate Idempotent EF Core Migration Bundle
        run: |
          dotnet ef migrations bundle \
            --project src/SocarDispatch.Infrastructure \
            --startup-project src/SocarDispatch.API \
            --output efbundle \
            --self-contained -r linux-x64 \
            --configuration Release \
            --force

      - name: Upload Migration Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ef-migration-bundle
          path: backend/efbundle
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Stage 3: Docker Buildx, Trivy Security Scan & Registry Release
  # ----------------------------------------------------------------------------
  build-scan-and-publish:
    name: Build Containers, Trivy Scan & Publish
    needs: [dockerfile-lint, database-migration-guard]
    runs-on: ubuntu-latest
    env:
      REGISTRY_API_IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'decuayer' }}/aegis-dispatch-api
      REGISTRY_WEB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'decuayer' }}/aegis-dispatch-web
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend API Image Metadata
      - name: Extract Docker Metadata (Backend API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_API_IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Web Client Image Metadata
      - name: Extract Docker Metadata (Web Client)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_WEB_IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      # Local Build for Security Scan (Backend API)
      - name: Build Backend Image Locally for Security Scan
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          load: true
          tags: ${{ env.REGISTRY_API_IMAGE }}:test-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Local Build for Security Scan (Web Client)
      - name: Build Web Client Image Locally for Security Scan
        uses: docker/build-push-action@v6
        with:
          context: clients/web/SocarDispatch.Web
          file: clients/web/SocarDispatch.Web/Dockerfile
          load: true
          tags: ${{ env.REGISTRY_WEB_IMAGE }}:test-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Security Scan (Backend API)
      - name: Run Trivy Vulnerability Scanner (Backend API)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_API_IMAGE }}:test-scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Security Scan (Web Client)
      - name: Run Trivy Vulnerability Scanner (Web Client)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_WEB_IMAGE }}:test-scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Docker Hub Authentication
      - name: Log in to Docker Hub Registry
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Push Production Images
      - name: Publish Backend API Image to Registry
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Web Client Image to Registry
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: clients/web/SocarDispatch.Web
          file: clients/web/SocarDispatch.Web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
